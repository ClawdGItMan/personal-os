<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Personal OS — Max</title>
<link rel="stylesheet" href="hearth.css" />
<style>
  html, body { margin: 0; padding: 0; background: #1B1410; }
  .pn-frame {
    width: 100%; height: 100%;
    background: #0E1014;
    border-radius: inherit;
    overflow: hidden;
  }
  .pn-iframe {
    width: 100%; height: 100%;
    border: 0;
    display: block;
    background: #0E1014;
  }
  .pn-phone {
    width: 100%; height: 100%;
    background: #0E1014;
    border-radius: 36px;
    border: 8px solid #1A1410;
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.06),
      0 24px 60px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    position: relative;
  }
  .pn-phone::before {
    /* Dynamic Island */
    content: "";
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    width: 100px; height: 28px;
    background: #000;
    border-radius: 14px;
    z-index: 10;
  }
  .pn-phone__inner {
    width: 100%; height: 100%;
    border-radius: 28px;
    overflow: hidden;
  }
  .pn-cover {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #0E1014 0%, #14171C 100%);
    color: #F2EEE6;
    padding: 80px 96px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    font-family: "Manrope", system-ui, sans-serif;
  }
  .pn-cover__brand {
    display: flex; align-items: center; gap: 10px;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px; letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(242, 238, 230, 0.7);
  }
  .pn-cover__brand::before {
    content: "";
    width: 9px; height: 9px; border-radius: 50%;
    background: #8FA67A;
    box-shadow: 0 0 12px rgba(143, 166, 122, 0.6);
  }
  .pn-cover__title {
    font-family: "Newsreader", Georgia, serif;
    font-size: 96px;
    line-height: 0.96;
    letter-spacing: -0.03em;
    color: #F2EEE6;
  }
  .pn-cover__title em { font-style: italic; }
  .pn-cover__title b {
    font-weight: 400;
    color: #8FA67A;
  }
  .pn-cover__sub {
    margin-top: 24px;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(242, 238, 230, 0.5);
    max-width: 600px;
    line-height: 1.6;
  }
  .pn-cover__meta {
    display: flex;
    gap: 40px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(242, 238, 230, 0.4);
  }
  .pn-cover__meta b {
    color: #F2EEE6;
    font-weight: 400;
    display: block;
    margin-top: 4px;
    font-size: 14px;
  }
  .pn-cover__hint {
    display: flex; align-items: center; gap: 12px;
    color: rgba(242, 238, 230, 0.5);
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .pn-cover__arrow {
    display: inline-block;
    animation: arr 1.6s ease-in-out infinite;
  }
  @keyframes arr {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(6px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="app/design-canvas.jsx"></script>

<script type="text/babel" data-presets="env,react">
function PersonalOS() {
  return (
    <DesignCanvas brand="MAX OS" subtitle="Personal operating system · v0">
      <DCSection
        id="cover"
        title="Cover"
        subtitle="Project meta · open the artboards below to use the prototype"
      >
        <DCArtboard id="cover" label="Title" width={1600} height={900}>
          <div className="pn-cover">
            <div className="pn-cover__brand">
              <span>MAX OS · v0</span>
            </div>
            <div>
              <div className="pn-cover__title">
                <em>Personal</em> <b>operating system</b><br/>
                for one person.
              </div>
              <div className="pn-cover__sub">
                A calm operator console for Max Allaire — finances, health, training,
                calendar, social, and a Telegram-fed agent that quietly handles the rest.
              </div>
            </div>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-end", gap:40}}>
              <div style={{display:"flex", gap:48}}>
                <div className="pn-cover__meta">
                  Operator <b>Max Allaire</b>
                </div>
                <div className="pn-cover__meta">
                  Location <b>New York City</b>
                </div>
                <div className="pn-cover__meta">
                  Focus <b><em style={{fontFamily:"Newsreader"}}>Finding the idea.</em></b>
                </div>
                <div className="pn-cover__meta">
                  Streak <b>47 days</b>
                </div>
              </div>
              <div className="pn-cover__hint">
                <span>Web · Mobile</span>
                <span className="pn-cover__arrow">↓</span>
              </div>
            </div>
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="web"
        title="Web · dashboard"
        subtitle="Three-zone operator console — left rail, modules canvas, agent panel. Full interactive prototype."
      >
        <DCArtboard id="home" label="Home · live console" width={1600} height={1000}>
          <div className="pn-frame">
            <iframe className="pn-iframe" src="app/web.html" title="MAX OS Web"></iframe>
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="mobile"
        title="Mobile · companion"
        subtitle="Capture, agent, and the three views you'll actually open on the phone."
      >
        <DCArtboard id="mob-home" label="Mobile · Home" width={420} height={900}>
          <div className="pn-phone">
            <div className="pn-phone__inner">
              <iframe
                className="pn-iframe"
                src="app/mobile.html#HOME"
                title="MAX OS mobile home"
              ></iframe>
            </div>
          </div>
        </DCArtboard>
        <DCArtboard id="mob-agent" label="Mobile · Agent" width={420} height={900}>
          <div className="pn-phone">
            <div className="pn-phone__inner">
              <iframe
                className="pn-iframe"
                src="app/mobile.html?start=AGENT"
                title="MAX OS mobile agent"
              ></iframe>
            </div>
          </div>
        </DCArtboard>
        <DCArtboard id="mob-finance" label="Mobile · Finance" width={420} height={900}>
          <div className="pn-phone">
            <div className="pn-phone__inner">
              <iframe
                className="pn-iframe"
                src="app/mobile.html?start=FINANCE"
                title="MAX OS mobile finance"
              ></iframe>
            </div>
          </div>
        </DCArtboard>
        <DCArtboard id="mob-health" label="Mobile · Body" width={420} height={900}>
          <div className="pn-phone">
            <div className="pn-phone__inner">
              <iframe
                className="pn-iframe"
                src="app/mobile.html?start=HEALTH"
                title="MAX OS mobile health"
              ></iframe>
            </div>
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="notes"
        title="Reading the design"
        subtitle="Decisions that drive the system. Edit, drag, or open any artboard fullscreen (↗) to focus."
      >
        <DCArtboard id="notes-1" label="System notes" width={520} height={520}>
          <div style={{
            width:"100%", height:"100%", padding:"36px 40px",
            background:"#14171C", color:"#F2EEE6",
            fontFamily:"Manrope, system-ui, sans-serif",
            display:"flex", flexDirection:"column", gap:18, overflow:"auto",
          }}>
            <div style={{
              fontFamily:"JetBrains Mono, monospace", fontSize:11, letterSpacing:"0.16em",
              color:"rgba(242,238,230,0.5)", textTransform:"uppercase"
            }}>
              01 // VOCABULARY
            </div>
            <h2 style={{fontFamily:"Newsreader, serif", fontSize:24, margin:0, letterSpacing:"-0.01em"}}>
              An <em>operator console</em>, not a dashboard.
            </h2>
            <p style={{fontSize:13, lineHeight:1.6, color:"rgba(242,238,230,0.7)", margin:0}}>
              Numbered modules, mono labels, hairline borders, sage on near-black.
              Borrowed from terminal HUDs and command surfaces — built to feel like a
              cockpit you live in, not a feed you scroll.
            </p>
            <div style={{height:1, background:"rgba(242,238,230,0.08)", margin:"6px 0"}} />
            <div style={{
              fontFamily:"JetBrains Mono, monospace", fontSize:11, letterSpacing:"0.16em",
              color:"rgba(242,238,230,0.5)", textTransform:"uppercase"
            }}>
              02 // SPINE
            </div>
            <h2 style={{fontFamily:"Newsreader, serif", fontSize:24, margin:0, letterSpacing:"-0.01em"}}>
              The agent is the <em>nervous system.</em>
            </h2>
            <p style={{fontSize:13, lineHeight:1.6, color:"rgba(242,238,230,0.7)", margin:0}}>
              Right-rail chat panel on web, dedicated tab on mobile. Telegram is the
              ingress — you text it as you go, it routes, logs, and asks for confirmation.
              The capture bar at the top of every screen is the same surface, written in.
            </p>
            <div style={{height:1, background:"rgba(242,238,230,0.08)", margin:"6px 0"}} />
            <div style={{
              fontFamily:"JetBrains Mono, monospace", fontSize:11, letterSpacing:"0.16em",
              color:"rgba(242,238,230,0.5)", textTransform:"uppercase"
            }}>
              03 // INHERITED FROM HEARTH
            </div>
            <h2 style={{fontFamily:"Newsreader, serif", fontSize:24, margin:0, letterSpacing:"-0.01em"}}>
              Warm, never cold.
            </h2>
            <p style={{fontSize:13, lineHeight:1.6, color:"rgba(242,238,230,0.7)", margin:0}}>
              Cocoa instead of pure black. Sage greens instead of neon. Newsreader italics
              for the greeting and section titles. The Hearth tokens drive everything —
              just sitting on a deep slate-cocoa canvas instead of cream.
            </p>
          </div>
        </DCArtboard>

        <DCArtboard id="notes-2" label="Tweaks · themes" width={520} height={520}>
          <div style={{
            width:"100%", height:"100%", padding:"36px 40px",
            background:"#14171C", color:"#F2EEE6",
            fontFamily:"Manrope, system-ui, sans-serif",
            display:"flex", flexDirection:"column", gap:14,
          }}>
            <div style={{
              fontFamily:"JetBrains Mono, monospace", fontSize:11, letterSpacing:"0.16em",
              color:"rgba(242,238,230,0.5)", textTransform:"uppercase"
            }}>
              Tweaks · open the panel
            </div>
            <h2 style={{fontFamily:"Newsreader, serif", fontSize:26, margin:0, letterSpacing:"-0.01em"}}>
              Three themes, <em>one shape.</em>
            </h2>
            <p style={{fontSize:13, lineHeight:1.6, color:"rgba(242,238,230,0.72)", margin:0}}>
              Toggle the Tweaks panel in the web artboard to switch between:
            </p>
            <div style={{display:"flex", flexDirection:"column", gap:12, marginTop:8}}>
              {[
                {name:"Dark", c:"#0E1014", a:"#8FA67A", desc:"Default. Operator console. Sage on slate."},
                {name:"Cream", c:"#F7F2E8", a:"#5E7A4D", desc:"Hearth-faithful. Warm cream + sage."},
                {name:"Warm", c:"#1A1410", a:"#ED9569", desc:"Hybrid. Deep cocoa with ember accent."},
              ].map((t) => (
                <div key={t.name} style={{display:"flex", alignItems:"center", gap:14}}>
                  <div style={{
                    width:48, height:48, borderRadius:8,
                    background: t.c,
                    border: "1px solid rgba(242,238,230,0.12)",
                    display:"flex", alignItems:"center", justifyContent:"center",
                  }}>
                    <div style={{width:14, height:14, borderRadius:"50%", background: t.a}} />
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:14, color:"#F2EEE6"}}>{t.name}</div>
                    <div style={{
                      fontFamily:"JetBrains Mono, monospace", fontSize:10,
                      letterSpacing:"0.10em", color:"rgba(242,238,230,0.5)",
                      textTransform:"uppercase", marginTop:2,
                    }}>{t.desc}</div>
                  </div>
                </div>
              ))}
            </div>
            <div style={{marginTop:"auto", paddingTop:14,
              fontFamily:"JetBrains Mono, monospace", fontSize:10,
              letterSpacing:"0.14em", color:"rgba(242,238,230,0.4)",
              textTransform:"uppercase",
              borderTop:"1px solid rgba(242,238,230,0.08)",
            }}>
              ALSO TWEAKABLE · TYPOGRAPHY · DENSITY
            </div>
          </div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PersonalOS />);
</script>

</body>
</html>
